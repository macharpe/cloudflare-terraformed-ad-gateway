name: 'Update Domain Lists'

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated list of sources to update (adaway,easylist,stevenblack,malware,yoyo,all)'
        required: false
        default: 'adaway,easylist'
  schedule:
    - cron: '0 10 15 * *' # At 10:00 on day-of-month 15

env:
  FOLDER: './lists'

jobs:
  auto-update:
    runs-on: ubuntu-22.04

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: 📂 Checkout Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 🔗 Fetch Domain Lists
        working-directory: ${{ env.FOLDER }}
        env:
          INPUT_SOURCES: ${{ github.event.inputs.sources || 'adaway,easylist' }}
        run: |
          # Define sources
          declare -A SOURCES=(
            ["adaway"]="https://adaway.org/hosts.txt"
            ["easylist"]="https://someonewhocares.org/hosts/zero/hosts"
            ["stevenblack"]="https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
            ["malware"]="https://www.malwaredomainlist.com/hostslist/hosts.txt"
            ["yoyo"]="https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"
          )

          # Determine which sources to fetch
          INPUT_SOURCES="$INPUT_SOURCES"
          if [[ "$INPUT_SOURCES" == "all" ]]; then
            FETCH_SOURCES=(adaway easylist stevenblack malware yoyo)
          else
            IFS=',' read -ra FETCH_SOURCES <<< "$INPUT_SOURCES"
          fi

          echo "[*] Fetching sources: ${FETCH_SOURCES[*]}"

          # Create temporary files for each source
          > temp_combined.txt

          for source in "${FETCH_SOURCES[@]}"; do
            if [[ -v SOURCES[$source] ]]; then
              url="${SOURCES[$source]}"
              echo "[*] Fetching $source from: $url"
              
              if wget --quiet --timeout=30 "$url" -O "temp_$source.txt"; then
                echo "[*] Processing $source..."
                
                # Extract domains from hosts format (both 127.0.0.1 and 0.0.0.0)
                grep -E "^(127\.0\.0\.1|0\.0\.0\.0)" "temp_$source.txt" | \
                  awk '{print $2}' | \
                  grep -v "localhost" | \
                  grep -E '^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$' | \
                  sort -u >> temp_combined.txt
                
                rm "temp_$source.txt"
              else
                echo "[!] Failed to fetch $source"
              fi
            else
              echo "[!] Unknown source: $source"
            fi
          done

          # Process combined list
          echo "[*] Creating final domain list..."
          
          # Remove duplicates, sort, and create final file in hosts format
          sort -u temp_combined.txt | \
            sed 's/^/127.0.0.1 /' > pihole_domain_list.txt

          # Add header
          {
            echo "# Combined ad-blocking domain list"
            echo "# Sources: ${FETCH_SOURCES[*]}"
            echo "# Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "# Total domains: $(wc -l < pihole_domain_list.txt)"
            echo "#"
            cat pihole_domain_list.txt
          } > temp_final.txt
          
          mv temp_final.txt pihole_domain_list.txt
          rm -f temp_combined.txt

          echo "[*] Final domain count: $(grep -c "^127\.0\.0\.1" pihole_domain_list.txt)"

      - name: ↗️ Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        env:
          PR_SOURCES: ${{ github.event.inputs.sources || 'adaway,easylist' }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        with:
          token: ${{ secrets.AUTOMATION_PAT }}
          title: 'Update Domain Lists'
          branch-suffix: timestamp
          commit-message: |
            Update domain lists from multiple sources
            
            Sources updated: ${{ env.PR_SOURCES }}
            Updated: ${{ env.RUN_NUMBER }} (${{ env.RUN_ID }})
          body: |
            ## Domain List Update
            
            **Sources Updated:** `${{ env.PR_SOURCES }}`
            **Updated:** Run #${{ env.RUN_NUMBER }} on ${{ env.REF_NAME }}
            
            This PR updates the domain blocking lists from the specified sources.
            
            ### Changes
            - Updated `lists/pihole_domain_list.txt` with latest domains
            - Combined domains from multiple sources and removed duplicates
            
            ### Next Steps
            After merging, Terraform will automatically update the Cloudflare Zero Trust lists.

      - name: ⏳ Wait for Status Checks
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          PR_NUMBER="$PR_NUMBER"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "create-pull-request/patch" --state open --json number --jq '.[0].number')
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "Waiting for Security Scan with Semgrep check on PR #$PR_NUMBER..."
            # PR was created with AUTOMATION_PAT, so its pull_request event fires
            # semgrep-security-scan.yml natively -- that check is properly associated
            # with the PR and shows up in statusCheckRollup, unlike a workflow_dispatch run.
            # Poll for this specific check by name rather than "zero pending in the
            # rollup": right after PR creation the rollup can be genuinely empty for a
            # few seconds (check not queued yet), which looks identical to "all done".
            MAX_ATTEMPTS=30
            ATTEMPT=0

            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS: Checking Semgrep status..."

              SEMGREP_CHECK=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup[] | select(.name == "Security Scan with Semgrep")')
              SEMGREP_STATUS=$(echo "$SEMGREP_CHECK" | jq -r '.status // empty')
              SEMGREP_CONCLUSION=$(echo "$SEMGREP_CHECK" | jq -r '.conclusion // empty')

              if [ "$SEMGREP_STATUS" == "COMPLETED" ]; then
                if [ "$SEMGREP_CONCLUSION" == "SUCCESS" ] || [ "$SEMGREP_CONCLUSION" == "NEUTRAL" ] || [ "$SEMGREP_CONCLUSION" == "SKIPPED" ]; then
                  echo "Semgrep check passed!"
                  break
                else
                  echo "Semgrep check failed with conclusion: $SEMGREP_CONCLUSION"
                  exit 1
                fi
              else
                echo "Semgrep check not yet completed (status: ${SEMGREP_STATUS:-not yet registered})..."
              fi

              ATTEMPT=$((ATTEMPT + 1))
              sleep 10
            done

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Timeout waiting for Semgrep check. Current status:"
              gh pr checks "$PR_NUMBER"
              exit 1
            fi
          fi

      - name: 🔀 Squash and Merge PR
        if: steps.create-pr.outputs.pull-request-operation == 'created' || steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          PR_NUMBER="$PR_NUMBER"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "create-pull-request/patch" --state open --json number --jq '.[0].number')
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "Merging PR #$PR_NUMBER"
            # gh pr merge's mergeable_state precondition check is unreliable right after
            # a required check completes -- confirmed live: it kept reporting "blocked"
            # across repeated retries with delays, while a direct mergePullRequest
            # GraphQL mutation succeeded immediately both times. Merge via GraphQL instead.
            PR_NODE_ID=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.node_id')
            HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')
            MERGED=$(gh api graphql -f query='
              mutation($id: ID!, $sha: GitObjectID!) {
                mergePullRequest(input: {pullRequestId: $id, expectedHeadOid: $sha, mergeMethod: SQUASH}) {
                  pullRequest { merged }
                }
              }' -f id="$PR_NODE_ID" -f sha="$HEAD_SHA" --jq '.data.mergePullRequest.pullRequest.merged')

            if [ "$MERGED" != "true" ]; then
              echo "Failed to merge PR #$PR_NUMBER"
              ex